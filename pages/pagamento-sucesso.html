<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagamento Aprovado - Coordena+</title>

  <!-- Tailwind + Dark Mode -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>

  <!-- Aplica imediatamente o tema salvo (evita flash) -->
  <script>
    const _theme = localStorage.getItem('theme') || 'light';
    document.documentElement.classList.remove('light');
    if (_theme === 'dark') document.documentElement.classList.add('dark');
  </script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" referrerpolicy="no-referrer" />

  <!-- Favicon -->
  <link rel="icon" href="../assets/img/logo.png" type="image/png" />

  <!-- Estilos customizados -->
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-500">
  <div class="min-h-screen flex flex-col items-center justify-center px-4">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-8 max-w-md w-full text-center">
      <div class="mb-6">
        <i class="fas fa-check-circle text-green-500 text-6xl"></i>
      </div>
      <h1 class="text-2xl font-bold mb-4">Pagamento Aprovado!</h1>
      <p class="text-gray-600 dark:text-gray-300 mb-6">
        Seu pagamento foi processado com sucesso. A reserva do laboratório já está confirmada.
      </p>
      <div class="mb-6 p-4 bg-green-50 dark:bg-green-900 rounded-lg">
        <p class="font-semibold">Sua reserva está confirmada</p>
        <p class="text-sm text-gray-600 dark:text-gray-300 mt-1">Você receberá um e-mail com os detalhes</p>
      </div>
      <a href="../index.html" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-md py-3 inline-block transition">
        Voltar para o início
      </a>
    </div>
  </div>

  <footer class="text-center text-sm text-gray-600 dark:text-gray-400 pb-6 mt-8">
    Copyright© 2025 – Nexus Devsystem – Todos os direitos reservados.
  </footer>
</body>
</html>
