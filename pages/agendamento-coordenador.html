<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Agendar com Coordenador - Coordena+</title>

  <!-- Tailwind + Dark Mode -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>

  <!-- Aplica imediatamente o tema salvo (evita flash) -->
  <script>
    const _theme = localStorage.getItem('theme') || 'light';
    document.documentElement.classList.remove('light');
    if (_theme === 'dark') document.documentElement.classList.add('dark');
  </script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" referrerpolicy="no-referrer" />

  <!-- Favicon -->
  <link rel="icon" href="/assets/img/logo.png" type="image/png" />

  <!-- Estilos customizados -->
  <link rel="stylesheet" href="/assets/css/styles.css" />

  <!-- Auth logic -->
  <script src="/assets/js/auth.js"></script>
  <script>
    if (!window.Auth) {
      console.error('CRITICAL: Auth module failed to load on agendamento-coordenador page.');
    } else {
      // Verifica se é admin e redireciona se necessário
      (function () {
        try {
          if (Auth.isAdminLogged && Auth.isAdminLogged()) {
            location.replace("/pages/admin.html");
            return;
          }
        } catch (_) {}
        // Protege como página de usuário
        Auth.guardPage("user");
        Auth.remember();

        // expõe o usuário para o menu 
        window.user = typeof Auth.getUser === "function" ? Auth.getUser() : null;
      })();
    }
  </script>
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-500">
  <!-- =========================== -->
  <!-- Off-Canvas Menu -->
  <!-- =========================== -->
  <header class="offcanvas-menu">
    <input type="checkbox" id="toggle-menu" />
    <label for="toggle-menu" class="toggle-open"></label>

    <nav class="flex flex-col h-full">
      <div class="pt-12 pb-3">
        <img
          src="/assets/img/icons/letreiro.png"
          alt="Letreiro Coordena+"
          class="mx-auto h-50 w-auto"
        />
      </div>

      <label for="toggle-menu" class="toggle-close"></label>

      <ul class="menu-list py-2 space-y-2 list-none px-0">
        <li>
          <a
            href="/index.html"
            class="block text-lg font-medium text-gray-800 dark:text-gray-200 hover:text-blue-500"
          >
            <i class="fas fa-home me-2"></i>Início
          </a>
        </li>
        <li>
          <a
            href="/pages/agendamento.html"
            class="block text-lg font-medium text-gray-800 dark:text-gray-200 hover:text-blue-500"
          >
            <i class="fas fa-calendar me-2"></i>Agendamento
          </a>
        </li>
        <li>
          <a
            href="/pages/meus-agendamentos.html"
            class="block text-lg font-medium text-gray-800 dark:text-gray-200 hover:text-blue-500"
          >
            <i class="fas fa-list me-2"></i>Meus Agendamentos
          </a>
        </li>
        <li>
          <a
            href="/pages/coordenacao.html"
            class="block text-lg font-medium text-gray-800 dark:text-gray-200 hover:text-blue-500"
          >
            <i class="fas fa-users me-2"></i>Coordenadores
          </a>
        </li>
      </ul>

      <!-- Status da Sessão -->
      <div class="px-4 mb-2">
        <div id="session-indicator" class="text-xs text-center rounded py-1 px-2">
          <span id="session-text">●</span>
        </div>
      </div>

      <div class="mt-auto px-4 pb-6">
        <div class="flex items-center justify-between bg-gray-800 rounded-lg p-3">
          <div class="flex flex-col">
            <div id="menu-user-fullname" class="text-gray-100 font-medium">
              —
            </div>
            <div id="menu-user-role" class="text-gray-400 text-sm">—</div>
          </div>

          <div class="flex space-x-4">
            <button
              id="menu-theme-btn"
              class="text-yellow-400 hover:text-yellow-300"
              aria-label="Alternar tema"
            >
              <i class="fas fa-moon"></i>
            </button>

            <button
              id="menu-logout-btn"
              class="text-red-500 hover:text-red-400"
              aria-label="Sair"
            >
              <i class="fas fa-sign-out-alt"></i>
            </button>
          </div>
        </div>
      </div>
    </nav>
  </header>
  <!-- /Off-Canvas Menu -->

  <main class="min-h-screen px-4 py-8">
    <div class="max-w-4xl mx-auto">
      <div class="flex justify-between items-center mb-8">
        <div>
          <h1 class="text-3xl font-bold text-gray-800 dark:text-white">Agendar com Coordenador</h1>
          <p class="text-gray-600 dark:text-gray-300 mt-2">
            Agende um horário de atendimento com o coordenador do seu curso
          </p>
        </div>
      </div>

      <!-- Informações do Coordenador -->
      <div id="info-coordenador" class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-6 mb-8 hidden">
        <div class="flex items-start">
          <div class="w-20 h-20 rounded-full bg-gray-200 dark:bg-gray-600 overflow-hidden mr-6">
            <img id="foto-coordenador" src="" alt="Foto do Coordenador" class="w-full h-full object-cover" onerror="this.src='/assets/img/default-avatar.png';">
          </div>
          <div class="flex-1">
            <h2 id="nome-coordenador" class="text-2xl font-bold text-gray-900 dark:text-white"></h2>
            <p id="curso-coordenador" class="text-gray-600 dark:text-gray-300 text-lg mb-2"></p>
            <p class="text-gray-500 dark:text-gray-400 text-sm mb-2">
              <i class="fas fa-envelope mr-2"></i>
              <span id="email-coordenador"></span>
            </p>
            <div class="flex items-center mt-2">
              <div id="status-indicator" class="w-3 h-3 rounded-full mr-2"></div>
              <span id="status-text" class="font-medium"></span>
            </div>
          </div>
        </div>
      </div>

      <!-- Formulário de Agendamento -->
      <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-6">
        <form id="agendamento-coordenador-form">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div>
              <label for="data-atendimento" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                Data do Atendimento
              </label>
              <input 
                type="date" 
                id="data-atendimento" 
                required
                class="w-full px-3 py-2 border rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-400">
            </div>
            
            <div>
              <label for="hora-atendimento" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                Horário
              </label>
              <select 
                id="hora-atendimento" 
                required
                class="w-full px-3 py-2 border rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-400">
                <option value="">Selecione um horário</option>
                <option value="08:00">08:00 - 09:00</option>
                <option value="09:00">09:00 - 10:00</option>
                <option value="10:00">10:00 - 11:00</option>
                <option value="11:00">11:00 - 12:00</option>
                <option value="14:00">14:00 - 15:00</option>
                <option value="15:00">15:00 - 16:00</option>
                <option value="16:00">16:00 - 17:00</option>
                <option value="17:00">17:00 - 18:00</option>
              </select>
            </div>
          </div>

          <div class="mb-6">
            <label for="motivo" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
              Motivo do Atendimento
            </label>
            <textarea 
              id="motivo" 
              rows="4" 
              placeholder="Descreva o motivo do seu atendimento com o coordenador..."
              required
              class="w-full px-3 py-2 border rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-400"></textarea>
          </div>

          <div class="mb-6">
            <label for="curso-aluno" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
              Seu Curso
            </label>
            <select 
              id="curso-aluno" 
              required
              class="w-full px-3 py-2 border rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-400">
              <option value="">Selecione seu curso</option>
              <option value="Engenharia de Computação">Engenharia de Computação</option>
              <option value="Ciência da Computação">Ciência da Computação</option>
              <option value="Sistemas de Informação">Sistemas de Informação</option>
              <option value="Engenharia de Software">Engenharia de Software</option>
            </select>
          </div>

          <div class="mb-6">
            <label for="matricula" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
              Número de Matrícula
            </label>
            <input 
              type="text" 
              id="matricula" 
              placeholder="Digite seu número de matrícula"
              required
              class="w-full px-3 py-2 border rounded-md bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-blue-400">
          </div>

          <div class="flex justify-end space-x-4">
            <a href="/pages/coordenacao.html" class="px-6 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition">
              Voltar
            </a>
            <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
              <i class="fas fa-calendar-plus mr-2"></i>Agendar Atendimento
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Modal de Confirmação -->
  <div id="modal-confirmacao" class="fixed inset-0 z-50 hidden overflow-y-auto">
    <div class="fixed inset-0 bg-black bg-opacity-50" onclick="fecharModalConfirmacao()"></div>
    <div class="relative w-full max-w-md max-h-screen overflow-y-auto mx-auto my-20">
      <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-6">
        <div class="flex justify-between items-start mb-4">
          <h3 class="text-xl font-bold text-gray-900 dark:text-white">Agendamento Confirmado</h3>
          <button onclick="fecharModalConfirmacao()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
            <i class="fas fa-times text-2xl"></i>
          </button>
        </div>
        
        <div class="text-center py-6">
          <i class="fas fa-check-circle text-5xl text-green-500 mb-4"></i>
          <h4 class="text-lg font-semibold text-gray-900 dark:text-white mb-2">Atendimento Agendado!</h4>
          <p class="text-gray-600 dark:text-gray-300 mb-4">
            Seu atendimento com o coordenador foi agendado com sucesso.
          </p>
          <p class="text-sm text-gray-500 dark:text-gray-400" id="detalhes-agendamento"></p>
        </div>
        
        <div class="flex justify-end">
          <button onclick="fecharModalConfirmacao()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
            Fechar
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Função para carregar informações do coordenador (se vier da página de coordenação)
    function carregarInfoCoordenador() {
      const coordenadorData = sessionStorage.getItem('coordenadorAgendamento');
      if (coordenadorData) {
        try {
          const coord = JSON.parse(coordenadorData);
          
          document.getElementById('foto-coordenador').src = coord.foto || '/assets/img/default-avatar.png';
          document.getElementById('nome-coordenador').textContent = coord.nome;
          document.getElementById('curso-coordenador').textContent = coord.curso;
          document.getElementById('email-coordenador').textContent = coord.email;
          
          // Atualizar status (simplificado para esta página)
          const statusIndicator = document.getElementById('status-indicator');
          const statusText = document.getElementById('status-text');
          statusIndicator.className = 'w-3 h-3 rounded-full bg-green-500 mr-2';
          statusText.textContent = 'Disponível para atendimento';
          statusText.className = 'font-medium text-green-600 dark:text-green-400';
          
          document.getElementById('info-coordenador').classList.remove('hidden');
        } catch (e) {
          console.error('Erro ao carregar informações do coordenador:', e);
        }
      }
    }

    // Função para lidar com o envio do formulário
    async function handleSubmit(event) {
      event.preventDefault();
      
      const formData = {
        data: document.getElementById('data-atendimento').value,
        hora: document.getElementById('hora-atendimento').value,
        motivo: document.getElementById('motivo').value,
        curso: document.getElementById('curso-aluno').value,
        matricula: document.getElementById('matricula').value,
        coordenador: null
      };

      // Adicionar informações do coordenador se disponíveis
      const coordenadorData = sessionStorage.getItem('coordenadorAgendamento');
      if (coordenadorData) {
        formData.coordenador = JSON.parse(coordenadorData);
      }

      try {
        // Aqui você pode implementar a lógica para salvar o agendamento
        // Por enquanto, vamos apenas exibir um modal de confirmação
        const dataFormatada = new Date(formData.data).toLocaleDateString('pt-BR');
        const horaFormatada = formData.hora;
        
        document.getElementById('detalhes-agendamento').innerHTML = `
          <strong>Data:</strong> ${dataFormatada}<br>
          <strong>Horário:</strong> ${horaFormatada}<br>
          <strong>Coordenador:</strong> ${formData.coordenador ? formData.coordenador.nome : 'Não especificado'}
        `;
        
        document.getElementById('modal-confirmacao').classList.remove('hidden');
        document.body.style.overflow = 'hidden';
        
        // Limpar sessionStorage após agendamento
        sessionStorage.removeItem('coordenadorAgendamento');
        
        // Resetar o formulário
        document.getElementById('agendamento-coordenador-form').reset();
      } catch (error) {
        console.error('Erro ao agendar atendimento:', error);
        alert('Erro ao agendar atendimento. Por favor, tente novamente.');
      }
    }

    // Função para fechar o modal de confirmação
    function fecharModalConfirmacao() {
      document.getElementById('modal-confirmacao').classList.add('hidden');
      document.body.style.overflow = 'auto';
    }

    // Event listeners
    document.addEventListener('DOMContentLoaded', () => {
      carregarInfoCoordenador();
      document.getElementById('agendamento-coordenador-form').addEventListener('submit', handleSubmit);
      
      // Preenche informações do usuário no menu
      if (window.user) {
        document.getElementById("menu-user-fullname").textContent = window.user.name || "—";
        let papel = "";
        switch (window.user.role) {
          case "admin": papel = "Administrador"; break;
          case "professor": papel = "Professor"; break;
          case "student": papel = "Aluno"; break;
          default: papel = window.user.role || "";
        }
        document.getElementById("menu-user-role").textContent = papel || "—";
      }
      
      // Atualiza status da sessão
      function updateSessionIndicator() {
        const user = Auth.getUser();
        const token = Auth.getToken();
        const text = document.getElementById('session-text');
        
        if (user && token) {
          text.innerHTML = '● Online';
          text.className = 'text-green-400';
        } else {
          text.innerHTML = '● Offline';  
          text.className = 'text-gray-400';
        }
      }
      
      updateSessionIndicator();
      setInterval(updateSessionIndicator, 30000);
    });

    // Eventos para o menu
    document.getElementById("menu-theme-btn")?.addEventListener("click", () => {
      document.documentElement.classList.toggle("dark");
      localStorage.setItem(
        "theme",
        document.documentElement.classList.contains("dark") ? "dark" : "light"
      );
    });

    document.getElementById("menu-logout-btn")?.addEventListener("click", () => {
      Auth.logout();
      window.location.replace("/login.html");
    });
  </script>
</body>
</html>
